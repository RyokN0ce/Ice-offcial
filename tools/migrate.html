<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>XML 转 D1 SQL 工具</title>
    <style>
        body { font-family: system-ui; max-width: 800px; margin: 40px auto; padding: 0 20px; background: #1d1d1f; color: #f5f5f7; }
        textarea { width: 100%; height: 200px; padding: 10px; font-family: monospace; background: #2c2c2e; color: #fff; border: 1px solid #444; border-radius: 8px; margin-bottom: 10px; }
        button { background: #0071e3; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0077ed; }
        #result { height: 300px; margin-top: 20px; }
    </style>
</head>
<body>

    <h2>XML 账号一键转 D1 SQL</h2>
    <p>将你原本的 userlist.xml 内容粘贴到下面：</p>
    <textarea id="xmlInput" placeholder="<users><user><name>admin</name>...</user></users>"></textarea>
    <button onclick="convert()">生成 SQL</button>

    <p style="margin-top: 20px;">复制下面的 SQL 到 Cloudflare D1 的 Console 执行：</p>
    <textarea id="result" readonly placeholder="生成的 SQL 会出现在这里..."></textarea>

    <script>
        function convert() {
            const xmlText = document.getElementById('xmlInput').value;
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlText, "text/xml");
            const users = xmlDoc.getElementsByTagName("user");
            
            let sql = "";
            let count = 0;

            for (let i = 0; i < users.length; i++) {
                const name = users[i].getElementsByTagName("name")[0]?.textContent || "";
                const pwd = users[i].getElementsByTagName("password")[0]?.textContent || "";
                const status = users[i].getElementsByTagName("status")[0]?.textContent || "active";
                
                if (name && pwd) {
                    // 转义单引号，防止 SQL 报错
                    const safeName = name.replace(/'/g, "''");
                    const safePwd = pwd.replace(/'/g, "''");
                    const safeStatus = status.replace(/'/g, "''");
                    
                    sql += `INSERT INTO users (username, password, status, nickname) VALUES ('${safeName}', '${safePwd}', '${safeStatus}', '${safeName}');\n`;
                    count++;
                }
            }

            if (count === 0) {
                document.getElementById('result').value = "没有解析到有效的账号数据，请检查 XML 格式。";
            } else {
                document.getElementById('result').value = sql;
            }
        }
    </script>
</body>
</html>
