<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · 冰冰冰官网</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #ffffff; --text: #1d1d1f; --text-secondary: #6e6e73;
            --card-bg: #f5f5f7; --link: #0066cc; --button-bg: #0071e3;
        }
        [data-theme="dark"] {
            --bg: #000000; --text: #f5f5f7; --text-secondary: #a1a1a6;
            --card-bg: #1c1c1e; --link: #2997ff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg); color: var(--text);
            display: flex; align-items: center; justify-content: center; height: 100vh;
            transition: background-color 0.35s ease;
        }
        .login-box {
            background: var(--card-bg); padding: 40px; border-radius: 18px;
            width: 100%; max-width: 360px; text-align: center;
            position: relative; overflow: hidden;
        }
        h1 { font-size: 32px; margin-bottom: 8px; }
        p { color: var(--text-secondary); margin-bottom: 24px; font-size: 14px; }
        input {
            width: 100%; padding: 12px 16px; margin-bottom: 16px;
            border-radius: 10px; border: 1px solid var(--text-secondary);
            background: var(--bg); color: var(--text); font-size: 16px;
            outline: none; transition: border 0.2s;
        }
        input:focus { border-color: var(--link); }
        button {
            width: 100%; padding: 12px; border-radius: 10px; border: none;
            background: var(--button-bg); color: #fff; font-size: 16px;
            font-weight: 600; cursor: pointer; margin-bottom: 16px;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .error { color: #ff453a; font-size: 14px; margin-bottom: 16px; display: none; }
        .back-link { color: var(--link); text-decoration: none; font-size: 14px; display: inline-block; margin: 0 8px;}

        /* 忘记密码面板 */
        #forgotPanel {
            display: none; text-align: left; position: absolute; inset: 0;
            background: var(--card-bg); padding: 40px; flex-direction: column; z-index: 10;
        }
        #forgotPanel h2 { font-size: 24px; margin-bottom: 20px; text-align: center; }
        #forgotPanel .q-label { font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; display: block; }
        #forgotPanel .tip { text-align: center; font-size: 12px; color: var(--text-secondary); margin-top: 20px; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="login-box" id="loginBox">
        <h1>Ice07终端</h1>
        <p>请输入你的冰鸣凭证</p>
        
        <div class="error" id="errorMsg">身份验证失败</div>

        <input type="text" id="username" placeholder="用户名 (Name)" autocomplete="off">
        <input type="password" id="password" placeholder="密码 (Password)">
        
        <button id="loginBtn">验证并进入</button>
        <div>
            <a href="#" class="back-link" id="forgotBtn">忘记密码？</a>
            <a href="#" class="back-link" id="cancelBtn">返回</a>
        </div>
    </div>

    <!-- 忘记密码子界面 -->
    <div class="login-box" id="forgotPanel">
        <h2>重置密码</h2>
        
        <div class="error" id="forgotMsg">验证失败</div>

        <input type="text" id="f_username" placeholder="请输入登录用户名" autocomplete="off">
        
        <!-- 安全问题区域，初始隐藏 -->
        <div id="securityArea" style="display: none;">
            <span class="q-label" id="label_q1">问题1</span>
            <input type="text" id="f_q1" placeholder="你的回答">
            
            <span class="q-label" id="label_q2">问题2</span>
            <input type="text" id="f_q2" placeholder="你的回答">
            
            <span class="q-label" id="label_q3">问题3</span>
            <input type="text" id="f_q3" placeholder="你的回答">

            <span class="q-label" style="margin-top: 10px;">设置新密码</span>
            <input type="password" id="f_newpwd" placeholder="请输入新密码">
        </div>

        <button id="verifyUserBtn" style="margin-top: 10px;">下一步</button>
        <button id="resetPwdBtn" style="display: none; margin-top: 10px;">确认重置密码</button>
        
        <a href="#" class="back-link" id="backToLogin" style="display:block; margin-top: 15px;">返回登录</a>
        
        <div class="tip">
            如果连安全问题也忘记了，请前往主页底部点击“联系我们”查看作者联系方式。<br>
            （作者通常一周看一次消息）
        </div>
    </div>

    <script>
        const saved = localStorage.getItem('ice-theme') || 'auto';
        let theme = saved === 'auto' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : saved;
        document.documentElement.setAttribute('data-theme', theme);

        const API_BASE = 'https://api.iceapis.dpdns.org';
        const urlParams = new URLSearchParams(window.location.search);
        const targetPage = urlParams.get('from') || 'main.html';
        
        const errorMsg = document.getElementById('errorMsg');

        // 登录逻辑
        document.getElementById('loginBtn').addEventListener('click', async function() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            if (!user || !pass) { errorMsg.textContent = "不能为空"; errorMsg.style.display = 'block'; return; }

            const btn = this;
            btn.disabled = true; btn.textContent = "验证中..."; errorMsg.style.display = 'none';

            try {
                const res = await fetch(API_BASE + '/api/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('ice_user', user);
                    localStorage.setItem('ice_token', data.token); 
                    localStorage.setItem('ice_nickname', data.nickname || user); 
                    try { window.parent.postMessage({ type: 'updateAuth' }, '*'); } catch (e) {}
                    try { window.parent.postMessage({ type: 'navigate', url: targetPage }, '*'); } catch (e) { window.location.href = '../' + targetPage; }
                } else if (res.status === 409) {
                    // 互踢逻辑
                    errorMsg.style.color = '#ff9f0a';
                    errorMsg.innerHTML = data.message + '<br><span style="font-size:12px;cursor:pointer;text-decoration:underline;margin-top:8px;display:inline-block;" id="forceBtn">强制下线并登录</span>';
                    errorMsg.style.display = 'block';
                    document.getElementById('forceBtn').onclick = async () => {
                        btn.disabled = true; btn.textContent = "验证中...";
                        const fRes = await fetch(API_BASE + '/api/force-login', {
                            method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ username: user, password: pass })
                        });
                        const fData = await fRes.json();
                        if (fRes.ok) {
                            localStorage.setItem('ice_user', user); localStorage.setItem('ice_token', fData.token); localStorage.setItem('ice_nickname', fData.nickname || user); 
                            try { window.parent.postMessage({ type: 'updateAuth' }, '*'); } catch (e) {}
                            try { window.parent.postMessage({ type: 'navigate', url: targetPage }, '*'); } catch (e) { window.location.href = '../' + targetPage; }
                        }
                    };
                } else {
                    errorMsg.style.color = '#ff453a';
                    errorMsg.textContent = data.error || "认证失败";
                    errorMsg.style.display = 'block';
                }
            } catch (e) { errorMsg.textContent = "网络错误"; errorMsg.style.display = 'block'; } 
            finally { btn.disabled = false; btn.textContent = "验证并进入"; }
        });

        // 返回逻辑
        document.getElementById('cancelBtn').onclick = function(e) {
            e.preventDefault();
            try { window.parent.postMessage({ type: 'navigate', url: targetPage }, '*'); } catch (err) { window.location.href = '../' + targetPage; }
        };

        // 忘记密码面板切换
        const loginBox = document.getElementById('loginBox');
        const forgotPanel = document.getElementById('forgotPanel');
        
        document.getElementById('forgotBtn').onclick = (e) => {
            e.preventDefault();
            loginBox.style.display = 'none';
            forgotPanel.style.display = 'flex';
        };
        document.getElementById('backToLogin').onclick = (e) => {
            e.preventDefault();
            forgotPanel.style.display = 'none';
            loginBox.style.display = 'block';
        };

        // 重置密码：第一步验证账号（模拟，实际上直接让填答案）
        document.getElementById('verifyUserBtn').onclick = async function() {
            const f_user = document.getElementById('f_username').value.trim();
            if (!f_user) { alert("请输入用户名"); return; }
            
            const fMsg = document.getElementById('forgotMsg');
            this.disabled = true; this.textContent = "查询中..."; fMsg.style.display = 'none';

            try {
                // 复用 profile 接口获取问题
                const res = await fetch(API_BASE + '/api/profile?user=' + encodeURIComponent(f_user));
                const data = await res.json();
                
                if (res.ok) {
                    // 这里由于后端 profile 没有返回 security_q1 字段（保护隐私），我们需要稍微变通
                    // 为了不让大家看到安全问题原文，我们这里写死前端提示，只要后端验证答案即可。
                    // 但更好的是后端返回问题。由于时间关系，这里直接显示固定的占位提示。
                    document.getElementById('label_q1').textContent = "安全问题 1";
                    document.getElementById('label_q2').textContent = "安全问题 2";
                    document.getElementById('label_q3').textContent = "安全问题 3";
                    
                    document.getElementById('securityArea').style.display = 'block';
                    this.style.display = 'none';
                    document.getElementById('resetPwdBtn').style.display = 'block';
                } else {
                    fMsg.textContent = "该用户不存在"; fMsg.style.display = 'block';
                }
            } catch (e) { fMsg.textContent = "网络错误"; fMsg.style.display = 'block'; }
            finally { this.disabled = false; this.textContent = "下一步"; }
        };

        // 重置密码：第二步提交并修改
        document.getElementById('resetPwdBtn').onclick = async function() {
            const f_user = document.getElementById('f_username').value.trim();
            const q1 = document.getElementById('f_q1').value.trim();
            const q2 = document.getElementById('f_q2').value.trim();
            const q3 = document.getElementById('f_q3').value.trim();
            const newPwd = document.getElementById('f_newpwd').value.trim();
            const fMsg = document.getElementById('forgotMsg');

            if (!q1 || !q2 || !q3 || !newPwd) { fMsg.textContent = "请填写完整"; fMsg.style.display = 'block'; return; }

            this.disabled = true; this.textContent = "重置中..."; fMsg.style.display = 'none';

            try {
                const res = await fetch(API_BASE + '/api/forgot-password', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: f_user, q1: q1, q2: q2, q3: q3, newPassword: newPwd })
                });
                const data = await res.json();

                if (res.ok) {
                    alert("密码重置成功，请使用新密码登录！");
                    forgotPanel.style.display = 'none';
                    loginBox.style.display = 'block';
                } else {
                    fMsg.textContent = data.error || "重置失败"; fMsg.style.display = 'block';
                }
            } catch (e) { fMsg.textContent = "网络错误"; fMsg.style.display = 'block'; }
            finally { this.disabled = false; this.textContent = "确认重置密码"; }
        };
    </script>
</body>
</html>
