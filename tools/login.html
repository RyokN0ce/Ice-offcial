<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · 冰冰冰官网</title>
    <script src="checkuser.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #ffffff; --text: #1d1d1f; --text-secondary: #6e6e73;
            --card-bg: #f5f5f7; --link: #0066cc; --button-bg: #0071e3;
        }
        [data-theme="dark"] {
            --bg: #000000; --text: #f5f5f7; --text-secondary: #a1a1a6;
            --card-bg: #1c1c1e; --link: #2997ff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg); color: var(--text);
            display: flex; align-items: center; justify-content: center; height: 100vh;
        }
        .login-box {
            background: var(--card-bg); padding: 40px; border-radius: 18px;
            width: 100%; max-width: 360px; text-align: center;
        }
        h1 { font-size: 32px; margin-bottom: 8px; }
        p { color: var(--text-secondary); margin-bottom: 24px; font-size: 14px; }
        input {
            width: 100%; padding: 12px 16px; margin-bottom: 16px;
            border-radius: 10px; border: 1px solid var(--text-secondary);
            background: var(--bg); color: var(--text); font-size: 16px;
            outline: none;
        }
        input:focus { border-color: var(--link); }
        button {
            width: 100%; padding: 12px; border-radius: 10px; border: none;
            background: var(--button-bg); color: #fff; font-size: 16px;
            font-weight: 600; cursor: pointer; margin-bottom: 16px;
        }
        button:hover { opacity: 0.9; }
        .error { color: #ff453a; font-size: 14px; margin-bottom: 16px; display: none; }
        .back-link { color: var(--link); text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>Ice07终端</h1>
        <p>请输入你的冰冰凭证</p>
        
        <div class="error" id="errorMsg">身份验证失败，请检查用户名或密码</div>

        <input type="text" id="username" placeholder="用户名 (Name)" autocomplete="off">
        <input type="password" id="password" placeholder="密码 (Password)">
        
        <button id="loginBtn">验证并进入</button>
        <a href="#" class="back-link" id="cancelBtn">取消并返回</a>
    </div>

    <script>
        // 初始化主题
        const saved = localStorage.getItem('ice-theme') || 'auto';
        let theme = saved === 'auto' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : saved;
        document.documentElement.setAttribute('data-theme', theme);

        // 获取返回目标（默认 main.html）
        const urlParams = new URLSearchParams(window.location.search);
        const targetPage = urlParams.get('from') || 'main.html';

        document.getElementById('loginBtn').addEventListener('click', async function() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            if (!user || !pass) {
                errorMsg.textContent = "用户名和密码不能为空";
                errorMsg.style.display = 'block';
                return;
            }

            try {
                // 因为 login.html 在 tools 目录下，XML 在 res 目录下
                const res = await fetch('../res/userlist.xml');
                const text = await res.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(text, "text/xml");
                const users = xmlDoc.getElementsByTagName("user");
                
                let isValid = false;
                for (let i = 0; i < users.length; i++) {
                    const name = users[i].getElementsByTagName("name")[0]?.textContent;
                    const pwd = users[i].getElementsByTagName("password")[0]?.textContent;
                    const status = users[i].getElementsByTagName("status")[0]?.textContent;
                    
                    if (name === user && pwd === pass) {
                        if (status === 'banned') {
                            errorMsg.textContent = "该账户已被冻结";
                            errorMsg.style.display = 'block';
                            return;
                        }
                        isValid = true;
                        break;
                    }
                }

                if (isValid) {
                    // 存入状态
                    localStorage.setItem('ice_user', user);
                    document.cookie = `ice_user=${user}; max-age=86400; path=/`;
                    
                    // 通知顶栏刷新
                    try {
                        window.parent.document.getElementById('navFrame').contentWindow.postMessage({ type: 'updateAuth' }, '*');
                    } catch (e) {}

                    // 登录成功，跳回来源页面
                    try {
                        window.parent.postMessage({ type: 'navigate', url: targetPage }, '*');
                    } catch (e) {
                        window.location.href = '../' + targetPage;
                    }
                } else {
                    errorMsg.textContent = "身份验证失败，请检查用户名或密码";
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                console.error(err);
                errorMsg.textContent = "无法连接至 Ice07 数据库 (XML 读取失败)";
                errorMsg.style.display = 'block';
            }
        });

        // 取消返回
        document.getElementById('cancelBtn').addEventListener('click', function(e) {
            e.preventDefault();
            try {
                window.parent.postMessage({ type: 'navigate', url: targetPage }, '*');
            } catch (err) {
                window.location.href = '../' + targetPage;
            }
        });
    </script>
</body>
</html>
