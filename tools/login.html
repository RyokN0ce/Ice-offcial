<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · 冰冰冰官网</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #ffffff; --text: #1d1d1f; --text-secondary: #6e6e73;
            --card-bg: #f5f5f7; --link: #0066cc; --button-bg: #0071e3;
        }
        [data-theme="dark"] {
            --bg: #000000; --text: #f5f5f7; --text-secondary: #a1a1a6;
            --card-bg: #1c1c1e; --link: #2997ff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg); color: var(--text);
            display: flex; align-items: center; justify-content: center; height: 100vh;
            transition: background-color 0.35s ease;
        }
        .login-box {
            background: var(--card-bg); padding: 40px; border-radius: 18px;
            width: 100%; max-width: 360px; text-align: center;
        }
        h1 { font-size: 32px; margin-bottom: 8px; }
        p { color: var(--text-secondary); margin-bottom: 24px; font-size: 14px; }
        input {
            width: 100%; padding: 12px 16px; margin-bottom: 16px;
            border-radius: 10px; border: 1px solid var(--text-secondary);
            background: var(--bg); color: var(--text); font-size: 16px;
            outline: none; transition: border 0.2s;
        }
        input:focus { border-color: var(--link); }
        button {
            width: 100%; padding: 12px; border-radius: 10px; border: none;
            background: var(--button-bg); color: #fff; font-size: 16px;
            font-weight: 600; cursor: pointer; margin-bottom: 16px;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .error { color: #ff453a; font-size: 14px; margin-bottom: 16px; display: none; }
        .back-link { color: var(--link); text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>Ice07终端</h1>
        <p>请输入你的冰鸣凭证</p>
        
        <div class="error" id="errorMsg">身份验证失败，请检查用户名或密码</div>

        <input type="text" id="username" placeholder="用户名 (Name)" autocomplete="off">
        <input type="password" id="password" placeholder="密码 (Password)">
        
        <button id="loginBtn">验证并进入</button>
        <a href="#" class="back-link" id="cancelBtn">取消并返回</a>
    </div>

    <script>
        // 初始化主题
        const saved = localStorage.getItem('ice-theme') || 'auto';
        let theme = saved === 'auto' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : saved;
        document.documentElement.setAttribute('data-theme', theme);

        // ⚠️ 确保这个链接是你实际的 Worker 链接，不要有尾随斜杠
        const API_BASE = 'https://api.iceapis.dpdns.org';

        const urlParams = new URLSearchParams(window.location.search);
        const fromParam = urlParams.get('from');
        let targetPage = 'main.html';
        if (fromParam) targetPage = decodeURIComponent(fromParam);

        let isForceLogin = false;

        document.getElementById('loginBtn').addEventListener('click', async function() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            if (!user || !pass) {
                errorMsg.textContent = "用户名和密码不能为空";
                errorMsg.style.display = 'block';
                return;
            }

            const btn = this;
            btn.disabled = true;
            btn.textContent = "验证中...";
            errorMsg.style.display = 'none';

            try {
                const endpoint = isForceLogin ? '/api/force-login' : '/api/login';
                
                const res = await fetch(API_BASE + endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });
                
                const data = await res.json();

                if (res.ok) {
                    // 验证成功，保存 Token
                    localStorage.setItem('ice_user', user);
                    localStorage.setItem('ice_token', data.token); 
                    
                    // 通知导航栏（通过外层框架转发）
                    try { window.parent.postMessage({ type: 'updateAuth' }, '*'); } catch (e) {}
                    
                    // 跳转（去掉多余的斜杠）
                    let finalUrl = targetPage.replace(/^\.\//, '').replace(/^\/+/, '');
                    try {
                        window.parent.postMessage({ type: 'navigate', url: finalUrl }, '*');
                    } catch (e) {
                        window.location.href = '../' + finalUrl;
                    }
                } else if (res.status === 409 && !isForceLogin) {
                    // 互踢检测
                    errorMsg.style.color = '#ff9f0a'; 
                    errorMsg.innerHTML = data.message + '<br><span style="font-size:12px;cursor:pointer;text-decoration:underline;margin-top:8px;display:inline-block;" id="forceBtn">点此强制下线该设备并重新登录</span>';
                    errorMsg.style.display = 'block';
                    
                    document.getElementById('forceBtn').onclick = function() {
                        isForceLogin = true;
                        btn.click(); 
                    };
                } else {
                    errorMsg.style.color = '#ff453a';
                    errorMsg.textContent = data.error || "认证失败";
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.style.color = '#ff453a';
                errorMsg.textContent = "网络连接失败 (请检查 Worker 链接是否正确)";
                errorMsg.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = "验证并进入";
            }
        });

        document.getElementById('cancelBtn').addEventListener('click', function(e) {
            e.preventDefault();
            let finalUrl = targetPage.replace(/^\.\//, '').replace(/^\/+/, '');
            try {
                window.parent.postMessage({ type: 'navigate', url: finalUrl }, '*');
            } catch (err) {
                window.location.href = '../' + finalUrl;
            }
        });
    </script>
</body>
</html>
