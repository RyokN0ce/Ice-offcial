<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社区 · 冰冰冰官网</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #ffffff; --text: #1d1d1f; --text-secondary: #6e6e73;
            --card-bg: #f5f5f7; --border: #d2d2d7; --link: #0066cc; --button-bg: #0071e3;
        }
        [data-theme="dark"] {
            --bg: #000000; --text: #f5f5f7; --text-secondary: #a1a1a6;
            --card-bg: #1c1c1e; --border: #38383a; --link: #2997ff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg); color: var(--text); padding: 40px 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        .search-container {
            width: 100%; max-width: 600px; margin-bottom: 40px;
            display: flex; gap: 10px;
        }
        input {
            flex: 1; padding: 14px 20px; border-radius: 30px; border: 1px solid var(--border);
            background: var(--card-bg); color: var(--text); font-size: 16px; outline: none; transition: 0.2s;
        }
        input:focus { border-color: var(--link); box-shadow: 0 0 0 3px rgba(0,102,204,0.1); }
        button {
            padding: 0 30px; border-radius: 30px; border: none; background: var(--button-bg);
            color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
        }
        
        .results-grid { width: 100%; max-width: 800px; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
        .user-card {
            background: var(--card-bg); padding: 20px; border-radius: 18px;
            display: flex; align-items: center; gap: 15px; text-decoration: none; color: var(--text) !important;
            transition: transform 0.2s, box-shadow 0.2s; cursor: pointer;
        }
        .user-card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .user-avatar {
            width: 50px; height: 50px; border-radius: 50%; background: var(--border);
            display: flex; align-items: center; justify-content: center; font-size: 24px; overflow: hidden;
        }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .user-info h3 { font-size: 16px; margin-bottom: 4px; }
        .user-info p { font-size: 13px; color: var(--text-secondary); }
        
        .empty-msg { text-align: center; color: var(--text-secondary); margin-top: 40px; display: none; }
    </style>
</head>
<body>

    <h1 style="margin-bottom: 30px;">探索 I 市居民</h1>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="输入用户名或昵称进行搜索...">
        <button id="searchBtn">搜索</button>
    </div>

    <div class="results-grid" id="resultsGrid"></div>
    <div class="empty-msg" id="emptyMsg">没有找到相关居民。</div>

    <script>
        const saved = localStorage.getItem('ice-theme') || 'auto';
        let theme = saved === 'auto' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : saved;
        document.documentElement.setAttribute('data-theme', theme);

        const API_BASE = 'https://ice-apis.ryokn0ce.workers.dev'; // ⚠️ 替换为你的 Worker 链接

        // ⚠️ 注意：这个搜索需要 Worker 提供一个 `/api/search` 接口（我们下一步写）
        async function doSearch() {
            const query = document.getElementById('searchInput').value.trim();
            const grid = document.getElementById('resultsGrid');
            const emptyMsg = document.getElementById('emptyMsg');
            
            grid.innerHTML = '<div style="color:var(--text-secondary); width:100%; text-align:center;">搜索中...</div>';
            emptyMsg.style.display = 'none';

            try {
                const res = await fetch(API_BASE + '/api/search?q=' + encodeURIComponent(query));
                const data = await res.json();

                grid.innerHTML = '';
                if (res.ok && data.data.length > 0) {
                    data.data.forEach(user => {
                        const a = document.createElement('a');
                        // 点击卡片跳转到个人主页
                        a.className = 'user-card';
                        a.onclick = (e) => {
                            e.preventDefault();
                            window.parent.postMessage({ type: 'navigate', url: 'pages/profile.html?user=' + encodeURIComponent(user.username) }, '*');
                        };

                        let avatarHtml = user.avatar_url ? `<img src="${user.avatar_url}">` : '👤';
                        
                        a.innerHTML = `
                            <div class="user-avatar">${avatarHtml}</div>
                            <div class="user-info">
                                <h3>${user.nickname || user.username}</h3>
                                <p>@${user.username}</p>
                            </div>
                        `;
                        grid.appendChild(a);
                    });
                } else {
                    emptyMsg.style.display = 'block';
                    emptyMsg.textContent = query ? "未找到该用户" : "目前还没有居民入驻哦~";
                }
            } catch (e) {
                grid.innerHTML = '';
                emptyMsg.style.display = 'block';
                emptyMsg.textContent = "网络连接失败";
            }
        }

        document.getElementById('searchBtn').onclick = doSearch;
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') doSearch();
        });

        // 初始加载空搜索（相当于列出所有人）
        doSearch();

        try { window.parent.postMessage({ type: 'pageLoaded', path: window.location.pathname }, '*'); } catch (e) {}
    </script>
</body>
</html>
