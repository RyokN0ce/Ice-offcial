<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隐私政策 · 冰冰冰官网</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #ffffff; --text: #1d1d1f; --text-secondary: #6e6e73;
            --card-bg: #f5f5f7; --border: #d2d2d7; --link: #0066cc;
        }
        [data-theme="dark"] {
            --bg: #000000; --text: #f5f5f7; --text-secondary: #a1a1a6;
            --card-bg: #1c1c1e; --border: #38383a; --link: #2997ff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg); color: var(--text);
            height: 100vh; display: flex; flex-direction: column;
            transition: background-color 0.35s ease;
        }
        
        /* 顶部工具栏 */
        .toolbar {
            padding: 12px 24px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .toolbar h1 { font-size: 18px; font-weight: 600; }
        .toolbar .actions { display: flex; gap: 16px; align-items: center; }
        .toolbar a {
            font-size: 14px; color: var(--link); text-decoration: none;
            cursor: pointer;
        }
        .toolbar a:hover { text-decoration: underline; }
        
        /* 文档预览区 */
        .document-container {
            flex: 1; width: 100%; height: 100%; border: none; background: #525659; /* PDF 默认灰色底色 */
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <h1>隐私政策</h1>
        <div class="actions">
            <!-- 提供下载原件的出口 -->
            <a href="../tools/privacy.pdf" download>下载文档原件</a>
            <a href="#" id="backBtn">返回首页</a>
        </div>
    </div>

    <!-- 用 iframe 直接挂载 PDF 文件预览 -->
    <iframe class="document-container" src="../tools/privacy.pdf" title="隐私政策文档"></iframe>

    <script>
        // 初始化主题
        const saved = localStorage.getItem('ice-theme') || 'auto';
        let theme = saved === 'auto' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : saved;
        document.documentElement.setAttribute('data-theme', theme);

        // 返回首页
        document.getElementById('backBtn').addEventListener('click', function(e) {
            e.preventDefault();
            try {
                window.parent.postMessage({ type: 'navigate', url: 'main.html' }, '*');
            } catch (err) {
                window.location.href = '../main.html';
            }
        });

        // 通知外层框架
        try { window.parent.postMessage({ type: 'pageLoaded', path: window.location.pathname }, '*'); } catch (e) {}
    </script>
</body>
</html>
