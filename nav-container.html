<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导航栏</title>
    <link rel="stylesheet" href="nav-container.css">
</head>
<body>

    <nav class="global-nav">
        <!-- 手机端汉堡按钮 (左侧) -->
        <div class="mobile-toggle" id="mobileToggle">☰</div>
        
        <!-- 手机端中央显示的当前高亮页 -->
        <div class="mobile-current-title" id="mobileCurrentTitle">冰冰冰官网</div>
        
        <ul id="navMenu">
            <!-- 桌面端 Logo (手机端隐藏) -->
            <li class="logo-placeholder desktop-only-auth"><a href="#" data-nav="main.html">🧊冰冰冰官网</a></li>
            
            <!-- 手机端专属的“首页”入口 -->
            <li class="mobile-only-auth" id="navHome"><a href="#" data-nav="main.html">首页</a></li>

            <li id="navWhat"><a href="#" data-nav="whatice.html">什么是冰冰冰</a></li>
            <li><a href="#" data-nav="#">探索冰冰冰档案馆</a></li>
            <li><a href="#" data-nav="pages/community.html">冰冰冰社区</a></li>
            <li id="navSupport"><a href="#" data-nav="pages/supportmain.html">支持</a></li>
            <li id="navAbout"><a href="#" data-nav="aboutus.html">关于</a></li>
            
            <!-- 手机端专属：登录/注册/退出 -->
            <li class="mobile-only-auth">
                <a href="#" id="mobileLoginBtn">登录</a>
            </li>
            <li class="mobile-only-auth">
                <a href="#" id="mobileRegisterBtn">注册</a>
            </li>
            <li class="mobile-only-auth" id="mobileLogoutLi" style="display: none;">
                <a href="#" id="mobileLogoutBtn" style="color: #ff453a;">退出登录</a>
            </li>
        </ul>
    </nav>

    <div class="nav-right-group">
        <!-- 桌面端登录/用户菜单 -->
        <div class="user-menu-container desktop-only-auth">
            <a href="#" class="nav-btn btn-login" id="navLoginBtn">登录</a>
            <div class="user-dropdown" id="userDropdown">
                <a href="#" id="menuProfileBtn">个人主页</a>
                <div class="dropdown-divider"></div>
                <a href="#" id="menuLogoutBtn">退出登录</a>
            </div>
        </div>
        <a href="#" class="nav-btn btn-register desktop-only-auth" id="navRegisterBtn">注册</a>
        
        <!-- 设置按钮 -->
        <div class="settings-btn" id="settingsBtn" title="设置">⚙️</div>
    </div>

    <div class="settings-panel" id="settingsPanel">
        <h3>设置</h3>
        <div class="setting-row" style="flex-direction: column; align-items: stretch; gap: 8px;">
            <label>主题</label>
            <div class="theme-group" id="theme-switcher">
                <button data-theme="light">☀️ 亮色</button>
                <button data-theme="dark">🌙 暗色</button>
                <button data-theme="auto">🔄 自动</button>
            </div>
        </div>
        <div class="setting-divider"></div>
        <div class="setting-row">
            <label for="musicToggle">播放音乐</label>
            <div class="toggle" id="musicToggle"></div>
        </div>
        <div class="setting-row" style="flex-direction: column; align-items: stretch; gap: 6px;">
            <label for="musicSelect">音乐选择</label>
            <select class="music-select" id="musicSelect">
                <option value="">加载中...</option>
            </select>
        </div>
        <div class="setting-divider"></div>
        <div class="setting-row" style="font-size: 12px; color: var(--text-tertiary);">
            <span>冰鸣状态</span>
            <span>🧊🧊🧊 正常</span>
        </div>
    </div>

    <audio id="bgMusic" loop preload="none"></audio>

    <script>
        // ⚠️ 确保这里是你最新的 API 地址
        const API_BASE = 'https://api.iceapis.dpdns.org';

        const settingsBtn = document.getElementById('settingsBtn');
        const settingsPanel = document.getElementById('settingsPanel');
        const mobileToggle = document.getElementById('mobileToggle');
        const navMenu = document.getElementById('navMenu');

        // ===== 设置面板 =====
        settingsBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            const isOpen = settingsPanel.classList.toggle('open');
            try { window.parent.postMessage({ type: 'settingsToggle', open: isOpen }, '*'); } catch (err) {}
        });

        document.addEventListener('click', function(e) {
            if (!settingsPanel.contains(e.target) && e.target !== settingsBtn) {
                if (settingsPanel.classList.contains('open')) {
                    settingsPanel.classList.remove('open');
                    try { window.parent.postMessage({ type: 'settingsToggle', open: false }, '*'); } catch (err) {}
                }
            }
        });

        // ===== 手机端汉堡菜单 =====
        if (mobileToggle) {
            mobileToggle.addEventListener('click', function(e) {
                e.stopPropagation();
                const isOpen = navMenu.classList.toggle('show-mobile-menu');
                try { window.parent.postMessage({ type: 'settingsToggle', open: isOpen }, '*'); } catch (err) {}
            });
        }

        // ===== 核心高亮与标题更新逻辑 =====
        function updateNavUI() {
            try {
                const contentFrame = window.parent.document.getElementById('contentFrame');
                if (!contentFrame) return;
                
                const path = contentFrame.contentWindow.location.pathname;
                const page = path.substring(path.lastIndexOf('/') + 1) || 'main.html';
                
                const mobileTitle = document.getElementById('mobileCurrentTitle');
                document.querySelectorAll('.global-nav li').forEach(li => li.classList.remove('nav-active'));
                
                if (page.includes('aboutus')) {
                    document.getElementById('navAbout').classList.add('nav-active');
                    if (mobileTitle) mobileTitle.textContent = '关于';
                } else if (page.includes('whatice')) {
                    document.getElementById('navWhat').classList.add('nav-active');
                    if (mobileTitle) mobileTitle.textContent = '什么是冰冰冰';
                } else if (page.includes('supportmain')) {
                    document.getElementById('navSupport').classList.add('nav-active');
                    if (mobileTitle) mobileTitle.textContent = '支持';
                } else if (page.includes('community')) {
                    // 社区页
                    const navCommunity = document.querySelector('.global-nav li a[data-nav="pages/community.html"]').parentElement;
                    if (navCommunity) navCommunity.classList.add('nav-active');
                    if (mobileTitle) mobileTitle.textContent = '社区';
                } else if (page.includes('profile')) {
                    // 个人主页
                    const navProfile = document.getElementById('navHome'); 
                    if (navProfile) navProfile.classList.add('nav-active');
                    if (mobileTitle) mobileTitle.textContent = '个人主页';
                } else {
                    // 首页
                    const homeNav = document.getElementById('navHome');
                    if (homeNav) homeNav.classList.add('nav-active');
                    const desktopLogo = document.querySelector('.logo-placeholder');
                    if (desktopLogo) desktopLogo.classList.add('nav-active');
                    if (mobileTitle) mobileTitle.textContent = '冰冰冰官网';
                }
            } catch (e) {}
        }

        setTimeout(updateNavUI, 500);

        // ===== 导航点击 =====
        document.querySelectorAll('[data-nav]').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const url = this.dataset.nav;
                if (url && url !== '#') {
                    window.parent.postMessage({ type: 'navigate', url: url }, '*');
                    if (navMenu.classList.contains('show-mobile-menu')) {
                        navMenu.classList.remove('show-mobile-menu');
                        try { window.parent.postMessage({ type: 'settingsToggle', open: false }, '*'); } catch (err) {}
                    }
                    setTimeout(updateNavUI, 300);
                }
            });
        });

        // 统一监听消息
        window.addEventListener('message', function(event) {
            if (event.data && (event.data.type === 'pageLoaded' || event.data.type === 'setActive')) {
                updateNavUI();
                updateAuthUI();
            }
            if (event.data && event.data.type === 'updateAuth') {
                updateAuthUI();
            }
        });

        // ===== 登录/注册 状态处理 =====
        const loginBtn = document.getElementById('navLoginBtn');
        const registerBtn = document.getElementById('navRegisterBtn');
        const mobileLoginBtn = document.getElementById('mobileLoginBtn');
        const mobileRegisterBtn = document.getElementById('mobileRegisterBtn');
        const mobileLogoutLi = document.getElementById('mobileLogoutLi');
        const mobileLogoutBtn = document.getElementById('mobileLogoutBtn');
        
        function handleLoginClick(e) {
            e.preventDefault();
            let targetPage = 'main.html';
            try {
                const contentFrame = window.parent.document.getElementById('contentFrame');
                let path = contentFrame.contentWindow.location.pathname;
                let relativePath = path.replace(/^\/|\/$/g, ''); 
                if (relativePath) targetPage = relativePath;
            } catch (err) {}
            try {
                window.parent.postMessage({ type: 'navigate', url: 'tools/login.html?from=' + encodeURIComponent(targetPage) }, '*');
            } catch (err) {}
        }

        function updateAuthUI() {
            const currentUser = localStorage.getItem('ice_user');
            
            // 桌面端
            if (currentUser) {
                loginBtn.textContent = currentUser;
                loginBtn.className = 'nav-btn btn-user';
                registerBtn.style.display = 'none';
                loginBtn.onclick = function(e) { e.preventDefault(); };
            } else {
                loginBtn.textContent = '登录';
                loginBtn.className = 'nav-btn btn-login';
                registerBtn.style.display = '';
                loginBtn.onclick = handleLoginClick;
            }

            // 手机端
            if (currentUser) {
                if (mobileLoginBtn) mobileLoginBtn.textContent = '个人中心 (' + currentUser + ')';
                if (mobileRegisterBtn) mobileRegisterBtn.parentElement.style.display = 'none';
                if (mobileLogoutLi) mobileLogoutLi.style.display = 'block';
            } else {
                if (mobileLoginBtn) mobileLoginBtn.textContent = '登录';
                if (mobileRegisterBtn) mobileRegisterBtn.parentElement.style.display = 'block';
                if (mobileLogoutLi) mobileLogoutLi.style.display = 'none';
            }
        }
        updateAuthUI();

        if (mobileLoginBtn) mobileLoginBtn.onclick = function(e) {
            if (localStorage.getItem('ice_user')) {
                e.preventDefault();
                try { window.parent.postMessage({ type: 'navigate', url: 'pages/profile.html' }, '*'); } catch (err) {}
            } else {
                handleLoginClick(e);
            }
        };
        
        if (mobileRegisterBtn) mobileRegisterBtn.onclick = function(e) {
            e.preventDefault();
            try { window.parent.postMessage({ type: 'navigate', url: 'pages/sign-in.html' }, '*'); } catch (err) {}
        };
        
        registerBtn.onclick = function(e) {
            e.preventDefault();
            try { window.parent.postMessage({ type: 'navigate', url: 'pages/sign-in.html' }, '*'); } catch (err) {}
        };

        // ===== 退出登录（修复版） =====
        async function logout() {
            const currentUser = localStorage.getItem('ice_user');
            
            // 1. 如果本地有用户，先请求后端销毁会话
            if (currentUser) {
                try {
                    await fetch(API_BASE + '/api/logout', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: currentUser })
                    });
                } catch (e) {
                    console.warn("后端退出请求失败，可能由于网络问题");
                }
            }

            // 2. 清理本地存储
            localStorage.removeItem('ice_user');
            localStorage.removeItem('ice_token');
            document.cookie = "ice_user=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            
            // 3. 刷新 UI 并跳转
            updateAuthUI();
            try { window.parent.postMessage({ type: 'navigate', url: 'main.html' }, '*'); } catch (err) {}
        }

        const menuLogoutBtn = document.getElementById('menuLogoutBtn');
        if (menuLogoutBtn) menuLogoutBtn.onclick = function(e) { e.preventDefault(); logout(); };
        
        if (mobileLogoutBtn) {
            mobileLogoutBtn.onclick = function(e) {
                e.preventDefault();
                logout();
                if (navMenu.classList.contains('show-mobile-menu')) {
                    navMenu.classList.remove('show-mobile-menu');
                    try { window.parent.postMessage({ type: 'settingsToggle', open: false }, '*'); } catch (err) {}
                }
            };
        }

        // ===== 下拉菜单 =====
        const menuProfileBtn = document.getElementById('menuProfileBtn');
        if (menuProfileBtn) {
            menuProfileBtn.onclick = function(e) { 
                e.preventDefault(); 
                try { window.parent.postMessage({ type: 'navigate', url: 'pages/profile.html' }, '*'); } catch (err) {} 
            };
        }

        const userMenuContainer = document.querySelector('.user-menu-container');
        const userDropdown = document.getElementById('userDropdown');
        let dropdownTimeout;

        function openDropdown() {
            clearTimeout(dropdownTimeout);
            if (localStorage.getItem('ice_user')) {
                userDropdown.classList.add('show');
                try { window.parent.postMessage({ type: 'settingsToggle', open: true }, '*'); } catch (e) {}
            }
        }

        function closeDropdown() {
            dropdownTimeout = setTimeout(() => {
                userDropdown.classList.remove('show');
                if (!settingsPanel.classList.contains('open') && !navMenu.classList.contains('show-mobile-menu')) {
                    try { window.parent.postMessage({ type: 'settingsToggle', open: false }, '*'); } catch (e) {}
                }
            }, 150);
        }

        if (userMenuContainer) {
            userMenuContainer.addEventListener('mouseenter', openDropdown);
            userMenuContainer.addEventListener('mouseleave', closeDropdown);
            userDropdown.addEventListener('mouseenter', openDropdown);
            userDropdown.addEventListener('mouseleave', closeDropdown);
        }
    </script>

    <script src="themeswitcher.js"></script>
    <script src="bgmswitcher.js"></script>
</body>
</html>
